
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit Complaint</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 25px;
            border-radius: 10px 10px 0 0;
        }

        .header h1 {
            margin: 0 0 10px;
        }

        .header p {
            margin: 0;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input[type="text"],
        textarea,
        select,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .hint {
            margin-top: 7px;
            color: #666;
            font-size: 13px;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        .back-link {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        button {
            background: #1f4e79;
            color: white;
        }

        button:hover {
            background: #163957;
        }

        .back-link {
            background: #e9ecef;
            color: #333;
        }

        #photo-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        #photo-preview img {
            width: 100px;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .form-box {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📝 Submit Complaint</h1>
        <p>Please provide the details of your complaint below.</p>
    </div>

    <div class="form-box">

        <form
            method="POST"
            action="{{ url_for('complaint') }}"
            enctype="multipart/form-data"
        >

            <!-- COMPLAINT SUBJECT -->
            <label for="subject">Complaint Subject</label>

            <input
                type="text"
                id="subject"
                name="subject"
                placeholder="Enter complaint subject"
                maxlength="200"
                required
            >

            <!-- COMPLAINT CATEGORY -->
            <label for="category">Complaint Category</label>

            <select id="category" name="category" required>
                <option value="">-- Select Category --</option>
                <option value="Academic">Academic</option>
                <option value="Hostel">Hostel</option>
                <option value="Library">Library</option>
                <option value="Transport">Transport</option>
                <option value="Canteen">Canteen</option>
                <option value="Infrastructure">Infrastructure</option>
                <option value="Other">Other</option>
            </select>

            <!-- COMPLAINT DESCRIPTION -->
            <label for="description">Complaint Description</label>

            <textarea
                id="description"
                name="description"
                placeholder="Describe your complaint in detail..."
                required
            ></textarea>

            <!-- PHOTO UPLOAD -->
            <label for="photos">Upload Complaint Photos (Optional)</label>

            <input
                type="file"
                id="photos"
                name="photos"
                accept=".jpg,.jpeg,.png,.webp"
                multiple
            >

            <p class="hint">
                Allowed formats: JPG, JPEG, PNG, WEBP.
                Maximum size: 5 MB per photo.
            </p>

            <div id="photo-preview"></div>

            <!-- BUTTONS -->
            <div class="button-row">

                <button type="submit">
                    Submit Complaint
                </button>

                <a
                    href="{{ url_for('dashboard') }}"
                    class="back-link"
                >
                    Back to Dashboard
                </a>

            </div>

        </form>

    </div>

</div>

<script>
    const photoInput = document.getElementById("photos");
    const photoPreview = document.getElementById("photo-preview");

    photoInput.addEventListener("change", function () {
        photoPreview.innerHTML = "";

        const files = Array.from(this.files);
        let totalSize = 0;

        for (const file of files) {
            totalSize += file.size;

            if (file.size > 5 * 1024 * 1024) {
                alert(file.name + " exceeds the 5 MB limit.");
                this.value = "";
                photoPreview.innerHTML = "";
                return;
            }

            if (file.size === 0) {
                alert(file.name + " is empty.");
                this.value = "";
                photoPreview.innerHTML = "";
                return;
            }

            if (![
                "image/jpeg",
                "image/png",
                "image/webp"
            ].includes(file.type)) {
                alert("Please select JPG, PNG or WEBP images only.");
                this.value = "";
                photoPreview.innerHTML = "";
                return;
            }

            const image = document.createElement("img");
            image.alt = "Selected complaint photo preview";
            image.src = URL.createObjectURL(file);

            image.onload = function () {
                URL.revokeObjectURL(image.src);
            };

            photoPreview.appendChild(image);
        }

        if (totalSize > 30 * 1024 * 1024) {
            alert("Total photo size must not exceed 30 MB.");
            this.value = "";
            photoPreview.innerHTML = "";
        }
    });
</script>

</body>
</html>
