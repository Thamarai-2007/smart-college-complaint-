<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 24px;
        }

        .logout {
            color: white;
            text-decoration: none;
            background: #dc2626;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .welcome h1 {
            color: #1e293b;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #64748b;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .card h3 {
            color: #1e293b;
            margin-bottom: 10px;
        }

        .card p {
            color: #64748b;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #2563eb;
            padding: 11px 22px;
            border-radius: 8px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 15px 20px;
            }

            .container {
                margin: 30px auto;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>🎓 Smart College</h2>

        <a href="{{ url_for('logout') }}" class="logout">
            Logout
        </a>
    </div>

    <div class="container">

        <div class="welcome">
            <h1>Welcome, {{ name }}! 👋</h1>
            <p>
                Welcome to your Student Complaint Management Dashboard.
            </p>
        </div>

        <div class="cards">

            <div class="card">
                <div class="icon">📝</div>

                <h3>Submit Complaint</h3>

                <p>
                    Have an issue? Submit your complaint to the college.
                </p>

                <a href="{{ url_for('complaint') }}" class="btn">
                    Submit Now
                </a>
            </div>


            <div class="card">
                <div class="icon">📋</div>

                <h3>My Complaints</h3>

                <p>
                    View your submitted complaints and their status.
                </p>

                <a href="{{ url_for('my_complaints') }}" class="btn">
                    View Complaints
                </a>
            </div>

        </div>

    </div>

</body>
</html>
