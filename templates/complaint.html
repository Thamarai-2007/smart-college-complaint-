<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit Complaint</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 24px;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #1e40af;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-box h1 {
            color: #1e293b;
            margin-bottom: 10px;
        }

        .form-box p {
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1e293b;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>🎓 Smart College</h2>

        <a href="{{ url_for('dashboard') }}" class="back">
            ← Dashboard
        </a>
    </div>

    <div class="container">

        <div class="form-box">

            <h1>📝 Submit Complaint</h1>

            <p>
                Please provide the details of your complaint below.
            </p>

            <form method="POST">

                <label for="subject">Complaint Subject</label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter complaint subject"
                    required
                >

                <label for="category">Category</label>

                <select id="category" name="category" required>

                    <option value="">-- Select Category --</option>
                    <option value="Academic">Academic</option>
                    <option value="Hostel">Hostel</option>
                    <option value="Library">Library</option>
                    <option value="Transport">Transport</option>
                    <option value="Canteen">Canteen</option>
                    <option value="Infrastructure">Infrastructure</option>
                    <option value="Other">Other</option>

                </select>

                <label for="description">Complaint Description</label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe your complaint..."
                    required
                ></textarea>

                <button type="submit" class="submit-btn">
                    Submit Complaint
                </button>

            </form>

        </div>

    </div>

</body>
</html>
